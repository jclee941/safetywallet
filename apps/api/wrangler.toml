name = "safetywallet"
main = "src/index.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat_v2"]
workers_dev = true

# Custom domain routes (requires Zone permissions in API token)
routes = [
  { pattern = "safetywallet.jclee.me/*", zone_name = "jclee.me" },
  { pattern = "admin.safetywallet.jclee.me", custom_domain = true },
]

[vars]
ENVIRONMENT = "production"
REQUIRE_ATTENDANCE_FOR_LOGIN = "true"
REQUIRE_ATTENDANCE_FOR_POST = "false"
ELASTICSEARCH_INDEX_PREFIX = "safetywallet-logs"
ALLOWED_ORIGINS = "https://safetywallet.jclee.me,https://admin.safetywallet.jclee.me"
VAPID_SUBJECT = "mailto:admin@safetywallet.jclee.me"
FAS_DB_NAME = "mdidev"
FAS_SITE_CD = "10"
FAS_SITE_NAME = "송도세브란스"
TURNSTILE_SITE_KEY = "0x4AAAAAACx3gVo8D92ukyCJ"

# Required secrets

# Required secrets — use .dev.vars for local dev, `wrangler secret put <NAME>` for production:
#   JWT_SECRET / HMAC_SECRET / ENCRYPTION_KEY / ALERT_WEBHOOK_URL / FAS_SYNC_SECRET / ELASTICSEARCH_URL / ELASTICSEARCH_API_KEY
#   JWT_SECRET          — JWT signing key
#   HMAC_SECRET         — HMAC-SHA256 for PII hashing
#   ENCRYPTION_KEY      — AES encryption for phone/DOB
#   ALERT_WEBHOOK_URL   — Webhook URL for operational alerts (cron failures, FAS down)
#   FAS_SYNC_SECRET     — Bearer secret for POST /fas-sync admin endpoint
#   ELASTICSEARCH_URL   — Elasticsearch endpoint (production only)
#   OPENROUTER_API_KEY           — API key for OpenRouter
#   OPENROUTER_MODEL_TEXT        — Text-only model (default: openrouter/free)
#   OPENROUTER_MODEL_MULTIMODAL  — Image/PDF-capable model (default: openrouter/free)
#   OPENROUTER_SITE_URL          — Optional HTTP-Referer header value
#   OPENROUTER_APP_NAME          — Optional X-OpenRouter-Title header value

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "safetywallet-db"
database_id = "45065dd5-1f89-4a1b-9e13-228594f309ce"

# R2 Bucket for images
[[r2_buckets]]
binding = "R2"
bucket_name = "safetywallet-images"

# R2 Bucket for static frontend files
[[r2_buckets]]
binding = "STATIC"
bucket_name = "safetywallet-static"

# R2 Bucket for acetime data
[[r2_buckets]]
binding = "ACETIME_BUCKET"
bucket_name = "safewallet-acetime"

# Hyperdrive — FAS MariaDB (direct connection)
[[hyperdrive]]
binding = "FAS_HYPERDRIVE"
id = "83c32c884d3b42b18c4b0601c0e2e0dc"
localConnectionString = "postgresql://root:root@localhost:5432/fas_local"

# KV Namespace for cache/sessions
[[kv_namespaces]]
binding = "KV"
id = "57ab28dca9dd4193a8f59f93e57122d8"

# Analytics Engine for observability
[[analytics_engine_datasets]]
binding = "ANALYTICS"

# Cloudflare Queue for reliable notification delivery
[[queues.producers]]
queue = "safewallet-notifications"
binding = "NOTIFICATION_QUEUE"

[[queues.consumers]]
queue = "safewallet-notifications"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "safewallet-notifications-dlq"

# Workers AI for hazard classification and privacy features
[ai]
binding = "AI"

# Workers Logs observability
[observability]
enabled = true
head_sampling_rate = 1

# Durable Objects for rate limiting
[durable_objects]
bindings = [
  { name = "RATE_LIMITER", class_name = "RateLimiter" },
  { name = "JOB_SCHEDULER", class_name = "JobScheduler" },
]


[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["JobScheduler"]


[env.dev]
name = "safetywallet-dev"

[env.dev.vars]
ENVIRONMENT = "development"
REQUIRE_ATTENDANCE_FOR_LOGIN = "false"
REQUIRE_ATTENDANCE_FOR_POST = "false"
ELASTICSEARCH_URL = "http://192.168.50.109:9200"
ELASTICSEARCH_INDEX_PREFIX = "safetywallet-logs"
ALLOWED_ORIGINS = "http://localhost:3000,http://localhost:3001"
VAPID_SUBJECT = "mailto:admin@safetywallet.jclee.me"
FAS_DB_NAME = "mdidev"
FAS_SITE_CD = "10"
FAS_SITE_NAME = "송도세브란스"


[assets]
directory = "../../dist"
binding = "ASSETS"
not_found_handling = "none"
run_worker_first = true

# Required secrets
# Required secrets — use .dev.vars for local dev, `wrangler secret put <NAME> --env dev` for staging:
