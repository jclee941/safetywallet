# GitLab CI/CD for SafetyWallet
# Migrated from GitHub Actions (ci.yml)

variables:
  NODE_VERSION: "20"
  GO_VERSION: "1.24"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"
  TURBO_CACHE_DIR: "$CI_PROJECT_DIR/.turbo"
  FF_USE_FASTZIP: "true"
  ARTIFACT_COMPRESSION_LEVEL: "fast"
  CACHE_COMPRESSION_LEVEL: "fast"
  # Memory optimization for all jobs
  NODE_OPTIONS: "--max-old-space-size=4096"
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_AUDIT: "false"

# Pipeline stages
stages:
  - prepare
  - validate
  - test
  - build
  - e2e
  - deploy

# Cache configuration
cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/
    - .turbo/
  policy: pull-push

# Default job configuration
default:
  image: node:20-slim
  before_script:
    - |
      # Memory-optimized npm install to prevent OOM kills
      npm ci --cache .npm --prefer-offline --no-audit || npm ci --cache .npm --prefer-offline --no-audit --maxsockets=1

# =============================================================================
# PREPARE STAGE
# =============================================================================

# No explicit prepare jobs needed - npm ci runs in before_script

# =============================================================================
# VALIDATE STAGE
# =============================================================================

lint:
  stage: validate
  variables:
    NPM_CONFIG_MAXSOCKETS: "1"
    NODE_OPTIONS: "--max-old-space-size=1536"
  before_script:
    - npm ci --cache .npm --prefer-offline --no-audit --maxsockets=1 || (sleep 5 && npm ci --cache .npm --prefer-offline --no-audit --maxsockets=1)
  script:
    - npm run lint --workspace=apps/api --workspace=apps/admin --workspace=apps/worker --workspace=packages/types
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "master"

typecheck:
  stage: validate
  variables:
    NPM_CONFIG_MAXSOCKETS: "1"
    NODE_OPTIONS: "--max-old-space-size=1536"
  before_script:
    - npm ci --cache .npm --prefer-offline --no-audit --maxsockets=1 || (sleep 5 && npm ci --cache .npm --prefer-offline --no-audit --maxsockets=1)
  script:
    - npm run typecheck
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "master"

guards:
  stage: validate
  image: node:20-slim
  variables:
    NPM_CONFIG_MAXSOCKETS: "1"
    NODE_OPTIONS: "--max-old-space-size=1536"
  before_script:
    - apt-get update && apt-get install -y grep
    - npm ci --cache .npm --prefer-offline --no-audit --ignore-scripts --maxsockets=1 || (sleep 5 && npm ci --cache .npm --prefer-offline --no-audit --ignore-scripts --maxsockets=1)
  script:
    # Block legacy runtime naming
    - |
      forbidden='safework2-api\.jclee\.workers\.dev|safetywallet-api\.jclee\.workers\.dev|workspace=safework2-api|Deploy SafeWork2'
      targets='docs/cloudflare-operations.md package.json'
      if grep -rnE "$forbidden" $targets 2>/dev/null; then
        echo "ERROR: Legacy runtime naming detected. Use single-worker safetywallet naming."
        exit 1
      fi
    # Ensure root/app wrangler configs stay aligned
    - node scripts/check-wrangler-sync.js
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "master"

anti-patterns:
  stage: validate
  image: golang:1.24-alpine
  before_script: []
  script:
    - |
      files=$(find apps packages -type f \( -name '*.ts' -o -name '*.tsx' \) ! -path '*/node_modules/*' ! -path '*/.next/*' ! -path '*/dist/*' ! -path '*/out/*')
      if [ -n "$files" ]; then
        echo "$files" | xargs go run scripts/check-anti-patterns.go
      fi
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "master"

naming:
  stage: validate
  variables:
    NPM_CONFIG_MAXSOCKETS: "1"
    NODE_OPTIONS: "--max-old-space-size=1536"
  before_script:
    - npm ci --cache .npm --prefer-offline --no-audit --ignore-scripts --maxsockets=1 || (sleep 5 && npm ci --cache .npm --prefer-offline --no-audit --ignore-scripts --maxsockets=1)
  script:
    - npm run lint:naming
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "master"

# =============================================================================
# TEST STAGE
# =============================================================================

unit-test:
  stage: test
  script:
    - npm run test
  artifacts:
    when: always
    reports:
      junit:
        - junit-*.xml
    paths:
      - coverage/
      - junit-*.xml
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "master"

security:
  stage: test
  script:
    - npm audit --audit-level=critical
  allow_failure: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "master"

sast:
  stage: test
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  script:
    - gitleaks detect --verbose --redact --no-git --source .
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "master"

d1-dryrun:
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - cd apps/api
    - npx wrangler d1 migrations apply safetywallet-db --local --config wrangler.toml

# =============================================================================
# BUILD STAGE
# =============================================================================

build:types:
  stage: build
  script:
    - npm run build --workspace=packages/types
  artifacts:
    paths:
      - packages/types/dist/
    expire_in: 1 hour
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "master"

build:worker:
  stage: build
  needs: [build:types]
  script:
    - npm run build --workspace=apps/worker
  artifacts:
    paths:
      - apps/worker/out/
    expire_in: 1 day
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "master"

build:admin:
  stage: build
  needs: [build:types]
  script:
    - npm run build --workspace=apps/admin
  artifacts:
    paths:
      - apps/admin/out/
    expire_in: 1 day
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "master"

build:api:
  stage: build
  needs: [build:types, build:worker, build:admin]
  script:
    - npm run build:static
    - sed -i "s/^VERSION = \"dev\"/VERSION = \"${CI_COMMIT_SHORT_SHA}\"/" wrangler.toml
    - sed -i "s/^VERSION = \"dev\"/VERSION = \"${CI_COMMIT_SHORT_SHA}\"/" apps/api/wrangler.toml
    - npm run build --workspace=apps/api
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "master"

# =============================================================================
# E2E STAGE
# =============================================================================

e2e-smoke:
  stage: e2e
  image: mcr.microsoft.com/playwright:v1.51.1-jammy
  needs: [build:types, build:worker, build:admin]
  before_script:
    - npm ci --cache .npm --prefer-offline --no-audit --ignore-scripts --maxsockets=1 || (sleep 5 && npm ci --cache .npm --prefer-offline --no-audit --ignore-scripts --maxsockets=1)
  script:
    - npx playwright install --with-deps chromium
    - npx playwright test --project=worker-smoke --project=admin-smoke
  artifacts:
    when: always
    paths:
      - playwright-report/
      - test-results/
    expire_in: 3 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "master"

# =============================================================================
# DEPLOY STAGE
# =============================================================================

deploy:worker:
  stage: deploy
  needs: [build:worker, build:admin, build:api]
  environment:
    name: production
    url: https://safetywallet.jclee.me
  script:
    - |
      echo "Deploying Worker to Cloudflare..."
      export CLOUDFLARE_API_TOKEN="${CLOUDFLARE_API_TOKEN:-${CLOUDFLARE_API_TOKEN_API:-${CLOUDFLARE_API_TOKEN_WORKER:-${CLOUDFLARE_API_TOKEN_ADMIN:-${CLOUDFLARE_API_TOKEN_PURGE:-${CF_API_TOKEN:-}}}}}}"
      export CLOUDFLARE_ACCOUNT_ID="${CLOUDFLARE_ACCOUNT_ID:-${CF_ACCOUNT_ID:-}}"
      if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
        echo "Error: CLOUDFLARE_API_TOKEN not set for deployment"
        exit 1
      fi

    - |
      echo "Deploying to Cloudflare..."
      cd apps/api
      npx wrangler deploy --config wrangler.toml --env=""
  rules:
    - if: $CI_COMMIT_BRANCH == "master"

d1-migrate:
  stage: deploy
  needs: [deploy:worker]
  environment:
    name: production
    url: https://safetywallet.jclee.me
  script:
    - cd apps/api
    - export CLOUDFLARE_API_TOKEN="${CLOUDFLARE_API_TOKEN:-${CLOUDFLARE_API_TOKEN_API:-${CLOUDFLARE_API_TOKEN_WORKER:-${CLOUDFLARE_API_TOKEN_ADMIN:-${CLOUDFLARE_API_TOKEN_PURGE:-${CF_API_TOKEN:-}}}}}}"
    - export CLOUDFLARE_ACCOUNT_ID="${CLOUDFLARE_ACCOUNT_ID:-${CF_ACCOUNT_ID:-}}"
    - |
      if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
        echo "Skipping d1 migration: no Cloudflare API token variable is configured in GitLab CI."
        exit 0
      fi
    - npx wrangler d1 migrations apply safetywallet-db --remote --env="" --config wrangler.toml
  rules:
    - if: $CI_COMMIT_BRANCH == "master"

deploy-verify:
  stage: deploy
  image: node:20-slim
  needs: [d1-migrate]
  environment:
    name: production
    url: https://safetywallet.jclee.me
  before_script:
    - apt-get update && apt-get install -y golang-go
    - npm ci --cache .npm --prefer-offline --no-audit --ignore-scripts --maxsockets=1 || (sleep 5 && npm ci --cache .npm --prefer-offline --no-audit --ignore-scripts --maxsockets=1)
  script:
    - |
      echo "Building deploy-verify tool..."
      cd scripts && go build -o deploy-verify deploy-verify.go && cd ..
    - |
      echo "Waiting for deployment to propagate..."
      sleep 30
    - |
      export CLOUDFLARE_API_TOKEN="${CLOUDFLARE_API_TOKEN:-${CLOUDFLARE_API_TOKEN_API:-${CLOUDFLARE_API_TOKEN_WORKER:-${CLOUDFLARE_API_TOKEN_ADMIN:-${CLOUDFLARE_API_TOKEN_PURGE:-${CF_API_TOKEN:-}}}}}}"
      export TURNSTILE_SECRET="${TURNSTILE_SECRET:-${TURNSTILE_SECRET_KEY:-}}"
      if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
        ./scripts/deploy-verify --api https://safetywallet.jclee.me --retries 5
      else
        echo "Error: CLOUDFLARE_API_TOKEN not set, deployment verification requires Cloudflare API access"
        exit 1
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == "master"

# =============================================================================
